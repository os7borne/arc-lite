<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus mode</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1c1c1e; --muted: #6e6e73; --accent: #ff6b57; --hover: rgba(0,0,0,.07); }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f7; --muted: #98989f; --hover: rgba(255,255,255,.1); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { text-align: center; padding: 24px; max-width: 460px; }
  .ring { position: relative; width: 168px; height: 168px; margin: 0 auto 22px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--hover); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring output { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 600;
                 font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; color: var(--muted); }
  #site { color: var(--fg); font-weight: 600; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 26px; }
  button { height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--hover); color: inherit; font: inherit; cursor: pointer; }
  button:hover { filter: brightness(.94); }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 18px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--hover); }
  .dots i.on { background: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="bar" cx="50" cy="50" r="46"/></svg>
    <output id="time">0:00</output>
  </div>
  <h1>Focus mode is on</h1>
  <p><span id="site">This site</span> is blocked until the session ends.</p>
  <div class="dots" id="dots" hidden></div>
  <div class="actions"><button id="back">Go back</button><button id="newtab">Open a new tab</button></div>
</main>
<script src="settings.js"></script>
<script src="blocked.js"></script>
</body>
</html>
