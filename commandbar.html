<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command bar</title>
<link rel="stylesheet" href="commandbar.css">
</head>
<body>
<div id="backdrop">
  <div id="panel" role="dialog" aria-label="Command bar">
    <div class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search tabs, history, actions or the web" aria-label="Command bar">
    </div>
    <ul id="list" role="listbox"></ul>
    <div class="foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> <b id="primary">new tab</b></span>
      <span><kbd>⇧↵</kbd> <b id="alt">this tab</b></span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
<script src="settings.js"></script>
<script src="commandbar.js"></script>
</body>
</html>
