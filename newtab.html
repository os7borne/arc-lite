<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
<script src="settings.js"></script>
<script src="newtab-boot.js"></script>
</head>
<body>
<div id="bg"></div>
<div id="dim"></div>
<button id="gear" title="Settings" aria-label="Settings">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<main>
  <header>
    <div id="clock"></div>
    <div id="greeting"></div>
  </header>

  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or enter address" autofocus>
    <ul id="sugg" hidden></ul>
  </div>

  <section class="todo" aria-label="Today">
    <div class="todo-head"><h2>Today</h2><span id="count"></span></div>
    <ul id="tasks"></ul>
    <button id="carry" hidden></button>
  </section>
</main>

<a id="credit" target="_blank" rel="noreferrer" hidden></a>

<footer id="foot">
  <button id="restore" hidden>Reopen last session</button>
  <span id="closed"></span>
</footer>

<script src="action-bar.js"></script>
<script src="buttons/media.js"></script>
<script src="buttons/downloads.js"></script>
<script src="command-bar.js"></script>
<script src="newtab.js"></script>
</body>
</html>
